services:
  - type: web
    name: matchai-backend
    runtime: python
    rootDir: backend
    buildCommand: >-
      pip install -r requirements-render.txt &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    plan: free
    pythonVersion: "3.11.9"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # After first deploy, paste your exact Render hostname here.
      # RENDER_EXTERNAL_HOSTNAME is also injected automatically by Render,
      # so DisallowedHost is avoided even before you set this.
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ai-employment-matching.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ai-employment-matching.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: matchai-db
          property: connectionString
      # Set to "False" to skip neural (SBERT) scoring on the free 512 MB tier.
      # The app still works fully; match scores use TF-IDF + BM25 only.
      - key: SBERT_ENABLED
        value: "True"
      # Optional — set only if you provision a Redis add-on for Celery.
      - key: REDIS_URL
        sync: false

databases:
  - name: matchai-db
    plan: free
