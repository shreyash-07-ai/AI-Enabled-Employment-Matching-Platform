services:
  - type: web
    name: matchai-backend
    runtime: python
    rootDir: backend
    # Python version must match what's set in the Render service environment.
    # Set PYTHON_VERSION=3.11.9 in Render environment variables (already done).
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements-render.txt &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput
    # 1 worker: free tier has 1 shared CPU; --timeout 120 gives the first
    # SBERT load attempt up to 2 minutes before Gunicorn kills the worker.
    # If SBERT_ENABLED=False (recommended for free tier) the timeout is never
    # reached because startup is <2 seconds.
    startCommand: >-
      gunicorn core.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 1
      --timeout 120
      --log-level info
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # RENDER_EXTERNAL_HOSTNAME is injected automatically by Render.
      # You can also set ALLOWED_HOSTS explicitly after the first deploy.
      - key: ALLOWED_HOSTS
        value: "ai-enabled-employment-matching-platform-1.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ai-employment-matching.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ai-employment-matching.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: matchai-db
          property: connectionString
      # Set SBERT_ENABLED=False on free tier (512 MB RAM).
      # Set True on Starter+ plans for full neural matching.
      - key: SBERT_ENABLED
        value: "False"
      # REDIS_URL is optional. Without it, Celery runs tasks synchronously.
      - key: REDIS_URL
        sync: false

databases:
  - name: matchai-db
    plan: free
