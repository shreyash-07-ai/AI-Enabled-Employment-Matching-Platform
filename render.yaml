services:
  - type: web
    name: matchai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    pythonVersion: "3.11.9"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false   # Set this to your actual Render URL after first deploy
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ai-employment-matching.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ai-employment-matching.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: matchai-db
          property: connectionString
      - key: REDIS_URL
        sync: false   # Optional — set if you provision a Redis instance

databases:
  - name: matchai-db
    plan: free
